stages:
  data_injection:
    cmd: python src/data/data_injection.py
    deps:
      - src/data/data_injection.py
      - src/constants/__init__.py
      - src/configuration/config.py
      - src/logger/__init__.py
      - src/exception/__init__.py
    outs:
      - data/raw/

  data_validation:
    cmd: python src/data/data_validation.py
    deps:
      - src/data/data_validation.py
      - src/data/data_injection.py
      - src/constants/__init__.py
      - src/configuration/config.py
      - src/logger/__init__.py
      - src/exception/__init__.py
      - config/schema.yaml
    outs:
      - data/data_validation/

  data_transformation:
    cmd: python src/data/data_preprocessing.py

    deps:
      - src/data/data_preprocessing.py
      - src/data/data_validation.py
      - src/data/data_injection.py
      - src/constants/__init__.py
      - src/configuration/config.py
      - src/logger/__init__.py
      - src/exception/__init__.py
      - config/schema.yaml
    outs:
      - data/preprocessed/
  model_training:
    cmd: python src/models/model_training.py

    deps:
      - src/models/model_training.py
      - src/data/data_preprocessing.py
      - src/data/data_validation.py
      - src/data/data_injection.py
      - src/constants/__init__.py
      - src/configuration/config.py
      - src/logger/__init__.py
      - src/exception/__init__.py
      - config/schema.yaml
    outs:
      - reports/

  register_model:
    cmd: python src/models/register_model.py

    deps:
      - src/models/register_model.py
      - src/models/model_training.py
      - src/data/data_preprocessing.py
      - src/data/data_validation.py
      - src/data/data_injection.py
      - src/constants/__init__.py
      - src/configuration/config.py
      - src/logger/__init__.py
      - src/exception/__init__.py
      - config/schema.yaml
      - reports/


  model_stage_transfer:
    cmd: python src/models/model_transaction.py

    deps:
      - src/models/model_transaction.py
      - src/models/register_model.py
      - src/models/model_training.py
      - src/data/data_preprocessing.py
      - src/data/data_validation.py
      - src/data/data_injection.py
      - src/constants/__init__.py
      - src/configuration/config.py
      - src/logger/__init__.py
      - src/exception/__init__.py
      - config/schema.yaml
      - reports/
  

  model_inference:

    cmd: python src/models/model_inference.py

    deps:
      - src/models/model_inference.py
      - src/models/model_transaction.py
      - src/models/register_model.py
      - src/models/model_training.py
      - src/data/data_preprocessing.py
      - src/data/data_validation.py
      - src/data/data_injection.py
      - src/constants/__init__.py
      - src/configuration/config.py
      - src/logger/__init__.py
      - src/exception/__init__.py
      - config/schema.yaml
      - reports/
  
  
  
 

