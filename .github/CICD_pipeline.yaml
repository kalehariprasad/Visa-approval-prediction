name: DVC Pipeline Automation

on:
  push:
    branches:
      - ops
  pull_request:
    branches:
      - main

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Python 3.10
      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'

      # Step 3: Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Lint your codebase
      - name: Lint the code
        run: flake8 src/

      # Step 6: Run data injection script with debug
      - name: Run data injection script with debug
        env:
          MONGO_CONNECTION_URL: ${{ secrets.MONGO_CONNECTION_URL }}
        run: |
          echo "▶ Running data injection..."
          python -u src/data/data_injection.py || {
            echo "❌ Data injection failed. Printing logs..."
            exit 1
          }
      # Step 7: Run data validation script
      - name: Run data validation script
        env:
          MONGO_URI: ${{ secrets.MONGO_CONNECTION_URL }}
        run: |
          echo "▶ Running data validation..."
          python src/data/data_validation.py

      # Step 8: Run data preprocessing script
      - name: Run data preprocessing script
        run: |
          echo "▶ Running data preprocessing..."
          python src/data/data_preprocessing.py
      # Step 9: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_MLFLOW_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_MLFLOW_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_MLFLOW_REGION }}
      # Step 10: Run Model training script
      - name: Model training
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI  }}
        run: |
          echo "▶ Running Model training..."
          python src/models/model_training.py
      # Step 11: Run Model register script
      - name: Model register
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI  }}
        run: |
          echo "▶ Running Model register..."
          python src/models/register_model.py
      # Step 12: Run Model transaction script
      - name: Model transaction
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI  }}
        run: |
          echo "▶ Running Model transaction..."
          python src/models/model_transaction.py
      # Step 12: Run Model transaction script
      - name: Model inference
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI  }}
        run: |
          echo "▶ Running Model inference..."
          python src/models/model_inference.py