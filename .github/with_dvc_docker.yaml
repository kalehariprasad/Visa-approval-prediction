name: DVC Pipeline Automation

on:
  push:
    branches:
      - ops
  pull_request:
    branches:
      - main

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Python 3.10
      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'

      # Step 3: Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4: Install dependencies (including DVC)
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Lint your codebase
      - name: Lint the code
        run: flake8 src/

      # Step 6: Configure AWS credentials (for MLflow, not DVC)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_MLFLOW_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_MLFLOW_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_MLFLOW_REGION }}

      # Step 7: Run the DVC pipeline
      - name: Run the DVC pipeline
        env:
          MONGO_CONNECTION_URL: ${{ secrets.MONGO_CONNECTION_URL }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          echo "▶ Running DVC pipeline ..."
          dvc repro

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-check   # ✅ ensures DVC pipeline passes first

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_MLFLOW_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_MLFLOW_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_MLFLOW_REGION }}

      - name: Check if Docker username secret exists
        if: ${{ secrets.DOCKERHUB_USERNAME == '' }}
        run: |
         echo "❌ DOCKERHUB_USERNAME is empty!"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}


      # Step 2: Build Docker image
      - name: Build Docker Image
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          echo "▶ Building Docker image ..."
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest .

